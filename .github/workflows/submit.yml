name: Submit to Kaggle

# Runs on each push to main that changes a submission file.
# Manual run: Actions → Submit to Kaggle → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - submission/**
      - task*/submit/**
  workflow_dispatch:
    inputs:
      message:
        description: Submission note (the commit SHA is added automatically)
        required: false
        type: string

permissions:
  contents: read

# One submission at a time. A newer run cancels the older one.
# A file Kaggle already accepted still counts against the daily limit.
concurrency:
  group: kaggle-submit
  cancel-in-progress: true

jobs:
  submit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_COMPETITION: ${{ vars.KAGGLE_COMPETITION }}
    steps:
      - name: Check configuration
        run: |
          missing=0
          if [ -z "$KAGGLE_API_TOKEN" ]; then echo "::error::Set repository secret KAGGLE_API_TOKEN"; missing=1; fi
          if [ -z "$KAGGLE_COMPETITION" ]; then echo "::error::Set repository variable KAGGLE_COMPETITION"; missing=1; fi
          exit "$missing"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            submission
            task1/submit
            task2/submit
            task3/submit
            task4/submit
            task5/submit
          sparse-checkout-cone-mode: true

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Check and merge
        run: |
          set -o pipefail
          uv run submission/merge.py | tee -a "$GITHUB_STEP_SUMMARY"

      # A cache entry keyed by the file hash marks each file that Kaggle already scored.
      - name: Hash merged submission
        id: hash
        run: echo "sha256=$(sha256sum submission/submission.csv | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Look for an earlier submission of this file
        id: seen
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .kaggle-submitted
          key: kaggle-submitted-${{ steps.hash.outputs.sha256 }}
          lookup-only: true

      - name: Skip unchanged submission
        if: steps.seen.outputs.cache-hit == 'true'
        run: |
          echo "::notice::Kaggle already has this submission file. Skipped the submit."
          echo "Kaggle already has this submission file (sha256 \`${{ steps.hash.outputs.sha256 }}\`). Skipped the submit." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged submission
        if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: submission-${{ github.sha }}
          path: submission/submission.csv
          if-no-files-found: error

      - name: Submit and wait for score
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          MESSAGE: ${{ inputs.message || github.event.head_commit.message }}
        run: |
          set -o pipefail
          MESSAGE="${MESSAGE%%$'\n'*}"
          note="${GITHUB_SHA::7} ${MESSAGE} (by ${GITHUB_ACTOR})"
          {
            echo "## Kaggle"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          uvx --from kaggle==2.2.5 --with six kaggle competitions submit "$KAGGLE_COMPETITION" \
            -f submission/submission.csv -m "$note" --wait 900 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          touch .kaggle-submitted

      - name: Mark file as submitted
        if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .kaggle-submitted
          key: kaggle-submitted-${{ steps.hash.outputs.sha256 }}

      - name: Show recent submissions
        if: always() && env.KAGGLE_API_TOKEN != '' && env.KAGGLE_COMPETITION != ''
        run: |
          {
            echo "### Recent submissions"
            echo
            echo '```'
            uvx --from kaggle==2.2.5 --with six kaggle competitions submissions "$KAGGLE_COMPETITION" | head -n 12
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
