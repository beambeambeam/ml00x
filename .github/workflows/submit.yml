name: Submit to Kaggle

# Runs on each push to main that changes a submission file.
# Manual run: Actions → Submit to Kaggle → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - submission/**
      - task*/submit/**
  workflow_dispatch:
    inputs:
      message:
        description: Submission note (the commit SHA is added automatically)
        required: false
        type: string
      force:
        description: Submit even if Kaggle already has this file
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  KAGGLE: uvx --from kaggle==2.2.5 --with six kaggle

jobs:
  # A newer run cancels this job. It never talks to Kaggle, so a cancel costs no submission.
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: kaggle-prepare
      cancel-in-progress: true
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: |
            submission
            task1/submit
            task2/submit
            task3/submit
            task4/submit
            task5/submit
          sparse-checkout-cone-mode: true

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Check and merge
        run: |
          set -o pipefail
          uv run submission/merge.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Hash merged submission
        id: hash
        run: echo "hash=$(sha256sum submission/submission.csv | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Upload merged submission
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: submission-${{ github.sha }}
          path: submission/submission.csv
          if-no-files-found: error

  # One submit at a time, and a running submit is never cancelled: it may already use a daily slot.
  # GitHub keeps only the newest waiting run in this group, so older waiting runs drop out.
  submit:
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: kaggle-submit
      cancel-in-progress: false
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_COMPETITION: ${{ vars.KAGGLE_COMPETITION }}
      HASH: ${{ needs.prepare.outputs.hash }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ] || [ -z "$KAGGLE_COMPETITION" ]; then
            echo "::notice::KAGGLE_API_TOKEN or KAGGLE_COMPETITION not configured in this repository. Skipping Kaggle submission."
            echo "Kaggle credentials not set in this repository. Skipped the submit." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.config.outputs.configured == 'true'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.config.outputs.configured == 'true'
        with:
          name: submission-${{ github.sha }}

      # Each note holds a `[sha:<hash>]` tag of its file, so Kaggle itself records what it already has.
      # The check runs here, inside the serial group, so two runs of one file cannot both pass it.
      - name: Look for an earlier submission of this file
        id: seen
        if: steps.config.outputs.configured == 'true' && !inputs.force
        run: |
          list=$($KAGGLE competitions submissions "$KAGGLE_COMPETITION" --csv --page-size 200 -q)
          if grep -qF "[sha:$HASH]" <<< "$list"; then
            echo "::notice::Kaggle already has this submission file (sha $HASH). Skipped the submit."
            echo "Kaggle already has this submission file (sha \`$HASH\`). Skipped the submit." >> "$GITHUB_STEP_SUMMARY"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit and wait for score
        if: steps.config.outputs.configured == 'true' && steps.seen.outputs.found != 'true'
        env:
          MESSAGE: ${{ inputs.message || github.event.head_commit.message }}
        run: |
          set -o pipefail
          MESSAGE="${MESSAGE%%$'\n'*}"
          note="${GITHUB_SHA::7} [sha:$HASH] ${MESSAGE} (by ${GITHUB_ACTOR})"
          {
            echo "## Kaggle"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          $KAGGLE competitions submit "$KAGGLE_COMPETITION" \
            -f submission.csv -m "$note" --wait 900 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Show recent submissions
        if: steps.config.outputs.configured == 'true'
        run: |
          {
            echo "### Recent submissions"
            echo
            echo '```'
            $KAGGLE competitions submissions "$KAGGLE_COMPETITION" | head -n 12
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
